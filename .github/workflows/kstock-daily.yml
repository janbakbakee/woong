name: 국내주식 수급 추천

on:
  schedule:
    # GitHub 예약은 수~수십 분 늦을 수 있어 조금 일찍. 휴장일은 코드에서 KIS 휴장일 조회로 건너뜀
    - cron: "50 21 * * 0-4"  # 평일 06:50 KST — 장 전 (07시 전후 도착 목표, 전일 확정 수급 + 미국 시장)
    - cron: "35 5 * * 1-5"   # 평일 14:35 KST — 장중 예비 (14:30 잠정 가집계 반영, 신호 있을 때만 전송)
    - cron: "7 9 * * 1-5"    # 평일 18:07 KST — 장 마감 후 (투자자 확정치 반영 이후)
  workflow_dispatch:
    inputs:
      session:
        description: "morning(장 전) / intraday(장중 예비) / close(장 마감)"
        type: choice
        options: [close, morning, intraday]
        default: close
      dry_run:
        description: "텔레그램 전송 없이 로그로만 확인"
        type: boolean
        default: false
      force:
        description: "휴장일에도 실행"
        type: boolean
        default: false
      site_only:
        description: "분석·텔레그램 없이 웹페이지만 다시 생성·배포 (양식 변경 반영용)"
        type: boolean
        default: false
      demo:
        description: "합성 데이터로 장 전·장중·장 마감 메시지 양식만 텔레그램 전송 (분석·커밋 없음)"
        type: boolean
        default: false

permissions:
  contents: write   # 장 마감 웹페이지(docs/kstock) 커밋
  pages: write
  id-token: write

concurrency:
  group: kstock-daily
  cancel-in-progress: false

jobs:
  # GitHub 예약 실행은 이 repo에서 매번 5~6시간 늦게 도착한다(정시 실행은 cron-job.org 등 외부 트리거가 담당).
  # 예약 실행은 백업으로만 쓰고, ① 같은 날 같은 세션이 이미 전송됐거나 ② 너무 늦어 의미가 없으면 건너뛴다.
  guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        run: |
          SESSION="${{ inputs.session || (github.event.schedule == '50 21 * * 0-4' && 'morning' || (github.event.schedule == '35 5 * * 1-5' && 'intraday' || 'close')) }}"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "key=kstock-sent-$(TZ=Asia/Seoul date +%F)-$SESSION" >> "$GITHUB_OUTPUT"
      - id: sent
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: work/sent
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SESSION: ${{ steps.key.outputs.session }}
          HIT: ${{ steps.sent.outputs.cache-hit }}
        run: |
          go=true; reason=""
          if [ "$EVENT" = "schedule" ]; then
            now=$((10#$(TZ=Asia/Seoul date +%H%M)))
            case "$SESSION" in
              morning)  [ "$now" -gt 930 ] && reason="장 전 메시지 유효시간(09:30) 경과" ;;
              intraday) [ "$now" -gt 1530 ] && reason="장중 메시지 유효시간(15:30) 경과" ;;
              close)    [ "$now" -lt 1600 ] && reason="장 마감 메시지 유효시간(당일 자정) 경과" ;;
            esac
            [ "$HIT" = "true" ] && reason="오늘 $SESSION 세션은 이미 전송됨"
            [ -n "$reason" ] && go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "### 실행 판단: go=$go ${reason:+— $reason}" >> "$GITHUB_STEP_SUMMARY"
          echo "go=$go $reason"

  recommend:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.upload.outcome == 'success' }}
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 국장톡 분리용 (있으면 우선 사용, 없으면 위 COT 봇/방으로 전송)
      KSTOCK_TELEGRAM_BOT_TOKEN: ${{ secrets.KSTOCK_TELEGRAM_BOT_TOKEN }}
      KSTOCK_TELEGRAM_CHAT_ID: ${{ secrets.KSTOCK_TELEGRAM_CHAT_ID }}
      KSTOCK_CAPITAL: ${{ secrets.KSTOCK_CAPITAL }}   # 선택: 계좌 자본 → 진입 신호에 매수 수량 표시
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 장중(14:35)엔 KIS 종목별 투자자 일별 API가 막혀 있어(00:00~15:40) 전날 장 마감 때 저장한 일봉을 꺼내 쓴다
      - name: 장 마감 일봉 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: work/rows.json
          key: kstock-rows-none
          restore-keys: kstock-rows-

      # 분석·웹페이지 생성까지만 하고 전송은 아래에서 (페이지 커밋 뒤 링크가 맞도록)
      - name: 추천 생성
        id: run
        run: |
          # 수동 실행은 입력값, 예약 실행은 어떤 cron이 울렸는지로 판별 (지연돼도 정확)
          SESSION="${{ inputs.session || (github.event.schedule == '50 21 * * 0-4' && 'morning' || (github.event.schedule == '35 5 * * 1-5' && 'intraday' || 'close')) }}"
          if [ "${{ inputs.demo }}" = "true" ]; then
            echo "session=demo" >> "$GITHUB_OUTPUT"   # 메시지 파일만 만들고 아래 전송 단계에서 보냄
            python -m kstock.main --demo --dry-run
            exit 0
          fi
          if [ "${{ inputs.site_only }}" = "true" ]; then
            echo "session=close" >> "$GITHUB_OUTPUT"   # 아래 커밋·배포 단계 사용 (메시지 파일이 없어 전송은 안 됨)
            python -m kstock.main --rebuild-site
            exit 0
          fi
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          python -m kstock.main --session "$SESSION" --dry-run ${{ inputs.force && '--force' || '' }}

      - name: 장 마감 일봉 캐시 저장
        if: steps.run.outputs.session == 'close' && hashFiles('work/rows.json') != ''
        uses: actions/cache/save@v4
        with:
          path: work/rows.json
          key: kstock-rows-${{ github.run_id }}

      # 웹페이지는 장 마감·장중 예비 상자만 갱신. COT와 같은 Pages 사이트(docs/)를 쓰므로 최신을 받아 얹는다
      - name: 웹페이지 커밋
        id: commit
        if: (steps.run.outputs.session == 'close' || steps.run.outputs.session == 'intraday') && !inputs.dry_run
        run: |
          git config user.name "kstock-bot"
          git config user.email "kstock-bot@users.noreply.github.com"
          git add docs/kstock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "국장 수급 페이지 업데이트 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Pages 아티팩트 업로드
        id: upload
        if: steps.commit.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 텔레그램 전송
        if: ${{ !inputs.dry_run }}
        run: |
          # 휴장일 등으로 메시지가 없으면 보내지 않음
          for f in work/kstock-*-${{ steps.run.outputs.session }}-msg.json; do
            if [ -e "$f" ]; then python -m kstock.main --send "$f"; fi
          done

      # 전송 완료 표시 → 늦게 도착한 예약 실행이 같은 메시지를 다시 보내지 않게 함
      - name: 전송 완료 표시
        if: ${{ success() && !inputs.dry_run && !inputs.demo && !inputs.site_only }}
        run: mkdir -p work/sent && date -u > work/sent/at
      - name: 전송 완료 기록
        if: ${{ success() && !inputs.dry_run && !inputs.demo && !inputs.site_only }}
        uses: actions/cache/save@v4
        continue-on-error: true   # 같은 키가 이미 있으면(수동 재실행) 저장 실패는 무시
        with:
          path: work/sent
          key: ${{ needs.guard.outputs.key }}

      # 백테스트용 후보 기록 — 레포에 커밋하지 않고 Actions 아티팩트로 90일 보관
      - name: 후보 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kstock-${{ github.run_id }}
          path: work/kstock-*
          retention-days: 90
          if-no-files-found: ignore

      - name: 실패 알림
        if: failure()
        run: python -m kstock.main --failure "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    needs: recommend
    if: needs.recommend.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
