name: COT 주간 리포트

on:
  schedule:
    # CFTC 발표: 금요일 15:30 ET (KST 토 04:30~05:30). 토요일 10시부터 실행,
    # 공휴일 등으로 발표가 늦어질 경우를 대비해 일·월·화에도 재시도 (완료된 주차는 자동 건너뜀)
    # 정각은 GitHub 예약이 몰려 지연되기 쉬워 7분으로 설정. 완성된 주차는 이후 실행에서 자동 건너뜀
    - cron: "7 1 * * 6"    # 토 10:07 KST (1차)
    - cron: "7 4 * * 6"    # 토 13:07 KST (2차 재시도)
    - cron: "7 7 * * 6"    # 토 16:07 KST (3차 재시도)
    - cron: "7 1 * * 0"    # 일 10:07 KST
    - cron: "7 1 * * 1"    # 월 10:07 KST
    - cron: "37 12 * * 2"  # 화 21:37 KST (마지막 — 실패 시 알림)
  workflow_dispatch:
    inputs:
      date:
        description: "기준 주차 — 예: 2026년 9월 2주차 / 2026-09-22 (비우면 최신 주차)"
        required: false
      force:
        description: "이미 생성된 주차도 다시 생성"
        type: boolean
        default: false
      no_ai:
        description: "Claude 분석 없이 수치만 생성"
        type: boolean
        default: false
      notify_latest:
        description: "새 리포트가 없어도 최신 리포트 알림 보내기 (텔레그램 연결 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cot-weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Claude Pro/Max 구독 토큰 (`claude setup-token` 으로 발급)
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      COT_AI_EXPECTED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && inputs.no_ai != true }}
    outputs:
      deploy: ${{ steps.upload.outcome == 'success' }}
      ran: ${{ steps.prep.outputs.run }}
      date: ${{ steps.prep.outputs.date }}
      waiting: ${{ steps.prep.outputs.waiting }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # Step 1·2: CFTC 데이터 조회 + 기준일 검증 + 지표 계산 + RSS 헤드라인 수집
      - name: 데이터 준비
        id: prep
        env:
          IN_DATE: ${{ inputs.date }}
          IN_FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          ARGS=()
          # 형식 검증은 Python(parse_week)에서 수행
          [[ -n "$IN_DATE" ]] && ARGS+=(--date "$IN_DATE")
          [[ "$IN_FORCE" == "true" ]] && ARGS+=(--force)
          # 화요일 마지막 재시도에서도 데이터가 없으면 실패로 표시해 알림을 받는다
          [[ "$SCHEDULE" == "37 12 * * 2" ]] && ARGS+=(--strict)
          python -m cot.main prepare "${ARGS[@]}"

      # Step 2.5·3: Claude(구독)가 뉴스 서치 후 work/news.md, work/analysis.json 작성
      - name: Claude 뉴스 서치 & CIO 분석
        if: steps.prep.outputs.run == 'true' && env.HAS_CLAUDE == 'true' && inputs.no_ai != true
        continue-on-error: true   # 실패해도 수치 리포트는 게시
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 코딩용 플러그인(ponytail)은 시장 분석에 불필요 → 이 실행에서는 끔
          settings: '{"enabledPlugins":{"ponytail@ponytail":false}}'
          prompt: |
            work/prompt.md 파일을 Read 도구로 읽고, 그 안의 지시를 처음부터 끝까지 정확히 수행해라.
            결과는 지시서에 적힌 두 파일(work/news.md, work/analysis.json)에만 Write로 저장한다.
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Write,WebSearch,WebFetch"
            ${{ vars.COT_MODEL && format('--model {0}', vars.COT_MODEL) || '' }}

      - name: 리포트 렌더링
        if: steps.prep.outputs.run == 'true'
        env:
          IN_NO_AI: ${{ inputs.no_ai }}
        run: |
          ARGS=()
          [[ "$IN_NO_AI" == "true" ]] && ARGS+=(--no-ai)
          python -m cot.main render "${ARGS[@]}"

      - name: 결과 커밋
        id: commit
        run: |
          git config user.name "cot-report-bot"
          git config user.email "cot-report-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "COT 리포트 업데이트 ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pages 아티팩트 업로드
        id: upload
        if: hashFiles('docs/index.html') != '' && (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: report
    if: needs.report.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 텔레그램 / ntfy 알림 (Secrets에 설정된 채널로만 전송)
  notify:
    needs: [report, deploy]
    # 새 리포트 생성·실패 시 알림. 정시 요청(workflow_dispatch)에서 CFTC 데이터가 없으면 '발표 지연' 안내
    if: always() && (needs.report.result == 'failure' || needs.deploy.result == 'failure' || needs.report.outputs.ran == 'true' || inputs.notify_latest == true || (github.event_name == 'workflow_dispatch' && needs.report.outputs.waiting != ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 방금 커밋된 리포트 포함
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FAILED: ${{ needs.report.result == 'failure' || needs.deploy.result == 'failure' }}
          REPORT_DATE: ${{ needs.report.outputs.date }}
          WAITING: ${{ needs.report.outputs.waiting }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            python -m cot.notify --failure --run-url "$RUN_URL"
          elif [[ -n "$WAITING" && -z "$REPORT_DATE" ]]; then
            # 토요일 정시 실행 때 CFTC 데이터가 아직 없음 → 지연 안내 (재시도는 일·월·화 예약 실행)
            python -m cot.notify --waiting "$WAITING"
          else
            python -m cot.notify ${REPORT_DATE:+--date "$REPORT_DATE"}
          fi
